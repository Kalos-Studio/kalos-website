<!-- Favicon for light UI: the Kalos mark in Obsidian Black, on transparency.
     Squared off the 69x62 export with symmetric padding (canvas 76, glyph
     translated 3.5/7) so browsers that letterbox a non-square favicon cannot
     squash it, and so this and icon-dark.svg land at the same optical size.
     No double hyphen anywhere in these comments: XML forbids it inside a
     comment, and the file silently stops parsing. -->
